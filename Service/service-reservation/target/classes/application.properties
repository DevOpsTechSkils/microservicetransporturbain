# Application
spring.application.name=service-reservation
server.port=8082

# Base de donnees MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db-reservation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#eureka.instance.prefer-ip-address=true
eureka.client.enabled=false

# Feign (appel vers service-paiement)
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
