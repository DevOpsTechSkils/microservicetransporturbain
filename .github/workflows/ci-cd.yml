name: CI/CD — Transport Urbain Cameroun

# Se déclenche sur chaque push/PR vers main
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ════════════════════════════════════════════════
  # JOB 1 : Tests et Build de l'Eureka Server
  # ════════════════════════════════════════════════
  build-eureka:
    name: Build & Test Eureka Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Eureka Server
        run: |
          cd eureka-server
          mvn clean package -DskipTests
        working-directory: ${{ github.workspace }}

      - name: Tests Eureka Server
        run: |
          cd eureka-server
          mvn test
        working-directory: ${{ github.workspace }}

      - name: Uploader le rapport de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eureka-test-results
          path: eureka-server/target/surefire-reports/

  # ════════════════════════════════════════════════
  # JOB 2 : Tests et Build de l'API Gateway
  # ════════════════════════════════════════════════
  build-gateway:
    name: Build & Test API Gateway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build API Gateway
        run: |
          cd api-gateway
          mvn clean package -DskipTests

      - name: Tests API Gateway
        run: |
          cd api-gateway
          mvn test

      - name: Uploader le rapport de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-test-results
          path: api-gateway/target/surefire-reports/

  # ════════════════════════════════════════════════
  # JOB 3 : Build des images Docker (seulement sur main)
  # ════════════════════════════════════════════════
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-eureka, build-gateway]  # Attend que les builds réussissent
    if: github.ref == 'refs/heads/main'   # Seulement sur la branche main

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Construire les JARs
        run: |
          cd eureka-server && mvn clean package -DskipTests && cd ..
          cd api-gateway   && mvn clean package -DskipTests && cd ..

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build et Push image Eureka
        uses: docker/build-push-action@v5
        with:
          context: ./eureka-server
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/transport-eureka:latest

      - name: Build et Push image Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/transport-gateway:latest

  # ════════════════════════════════════════════════
  # JOB 4 : Notification résultat (optionnel)
  # ════════════════════════════════════════════════
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: always()

    steps:
      - name: Résumé du pipeline
        run: |
          echo "Pipeline terminé"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Auteur: ${{ github.actor }}"
