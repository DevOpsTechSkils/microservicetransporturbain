name: CI/CD — Transport Urbain Cameroun

# ─── Déclencheurs ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ══════════════════════════════════════════════════════════════════════
  # JOB 1 : Build + Tests Eureka Server
  # ══════════════════════════════════════════════════════════════════════
  build-eureka:
    name: Build & Test Eureka Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4   # Node 20, pas déprécié

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Eureka Server
        working-directory: eureka-server
        run: mvn clean package -DskipTests

      - name: Tests Eureka Server
        working-directory: eureka-server
        run: mvn test
        # Le test peut passer même sans classe de test (Spring Boot génère une)

      - name: Upload rapport de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eureka-test-results
          # On uploade même si le dossier est vide (pas de tests écrits = normal)
          path: eureka-server/target/surefire-reports/
          if-no-files-found: ignore   # ← Correction : ne pas échouer si dossier vide

      - name: Upload JAR Eureka (pour le job Docker)
        uses: actions/upload-artifact@v4
        with:
          name: eureka-jar
          path: eureka-server/target/*.jar
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════
  # JOB 2 : Build + Tests API Gateway
  # ══════════════════════════════════════════════════════════════════════
  build-gateway:
    name: Build & Test API Gateway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build API Gateway
        working-directory: api-gateway
        run: mvn clean package -DskipTests

      - name: Tests API Gateway
        working-directory: api-gateway
        run: mvn test

      - name: Upload rapport de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-test-results
          path: api-gateway/target/surefire-reports/
          if-no-files-found: ignore   # ← Correction

      - name: Upload JAR Gateway (pour le job Docker)
        uses: actions/upload-artifact@v4
        with:
          name: gateway-jar
          path: api-gateway/target/*.jar
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════
  # JOB 3 : Build images Docker et push vers Docker Hub
  # Attend que les JARs soient disponibles, seulement sur main
  # ══════════════════════════════════════════════════════════════════════
  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ build-eureka, build-gateway ]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # ── Récupérer les JARs compilés par les jobs précédents ──────────
      - name: Télécharger JAR Eureka
        uses: actions/download-artifact@v4
        with:
          name: eureka-jar
          path: eureka-server/target/

      - name: Télécharger JAR Gateway
        uses: actions/download-artifact@v4
        with:
          name: gateway-jar
          path: api-gateway/target/

      # ── Connexion Docker Hub (secrets OBLIGATOIRES dans le dépôt) ────
      # Settings → Secrets and variables → Actions :
      #   DOCKER_USERNAME = votre identifiant Docker Hub
      #   DOCKER_PASSWORD = votre token Docker Hub (dckr_pat_...)
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Activer le build multi-plateforme (optionnel mais propre) ─────
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build et push image Eureka ────────────────────────────────────
      # Le Dockerfile copie target/*.jar, donc le JAR DOIT être présent
      - name: Build & Push image Eureka
        uses: docker/build-push-action@v5
        with:
          context: ./eureka-server
          file: ./eureka-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/transport-eureka:latest
            ${{ secrets.DOCKER_USERNAME }}/transport-eureka:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build et push image API Gateway ──────────────────────────────
      - name: Build & Push image API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/transport-gateway:latest
            ${{ secrets.DOCKER_USERNAME }}/transport-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════
  # JOB 4 : Résumé final du pipeline
  # ══════════════════════════════════════════════════════════════════════
  notify:
    name: Résumé pipeline
    runs-on: ubuntu-latest
    needs: [ build-docker ]
    if: always()

    steps:
      - name: Résumé du pipeline
        run: |
          echo "═══════════════════════════════════════"
          echo "  Pipeline Transport Urbain Cameroun"
          echo "═══════════════════════════════════════"
          echo "  Branche  : ${{ github.ref_name }}"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Auteur   : ${{ github.actor }}"
          echo "  Statut   : ${{ needs.build-docker.result }}"
          echo "═══════════════════════════════════════"
